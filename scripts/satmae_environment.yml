name: satmae-eval
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pytorch=1.12.1
  - torchvision=0.13.1
  - cudatoolkit=11.3
  - pip=22.3
  - pip:
      # Pinned to match the SatMAE checkpoint's original training env
      # (timm 0.3.2 API). We never import util/misc.py (which needs
      # torch._six, removed in torch>=1.13), so this combo is safe for
      # evaluation-only use. See registry/models/earth-science/satmae/README.md
      # (Troubleshooting) if you hit
      # torch._six ImportError from any other upstream script.
      - timm==0.3.2
      - pandas==1.5.3
      - numpy==1.23.5
      - pillow==9.4.0
      - rasterio==1.3.6
      - scikit-learn==1.2.2
      - tqdm==4.65.0
