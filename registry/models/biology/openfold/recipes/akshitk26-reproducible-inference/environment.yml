name: openfold-repro
channels:
  - conda-forge
  - bioconda
  - pytorch
  - nvidia
dependencies:
  - cuda
  - gcc=12.4
  - python=3.10
  - setuptools=59.5.0
  - pip
  - openmm
  - pdbfixer
  - pytorch-lightning
  - numpy
  - biopython
  - pandas
  - PyYAML
  - requests
  - scipy
  - tqdm
  - typing-extensions
  - wandb
  - modelcif==0.7
  - awscli
  - ml-collections
  - aria2
  - mkl
  - git
  - bioconda::hmmer
  - bioconda::hhsuite
  - bioconda::kalign2
  - pytorch::pytorch=2.5.1
  - pytorch::pytorch-cuda=12.4
  - pip:
      - deepspeed==0.14.5
      - dm-tree==0.1.6
      - cuda-python==12.4.0
      - git+https://github.com/NVIDIA/dllogger.git@0478734ff7be75adde8d160e04872664d1c62e5f
