# yaml-language-server: $schema=../schemas/execution_recipe.schema.json

id: satmae-temporal-inference-classification
name: SatMAE Temporal — fMoW-Temporal land-use classification inference
model: satmae-temporal
task: inference
description: >
  Load the official temporal ViT-Large checkpoint fine-tuned on fMoW-Temporal
  and score 62-way land-use classification on the validation CSV. Official
  repository result is 79.99% Top-1 without test-time augmentation. The paper
  ablation without TTA reports 79.69% for a closely related configuration;
  those numbers are documented separately and are not treated as identical.
  Inference only; no training or fine-tuning.

variants_supported:
  - satmae-temporal-vit-large  # finetune_fmow_temporal.pth; the only verified variant

input:
  format: RGB JPEG chips plus val_62classes.csv (label, relative path, timestamp)
  preprocessing: >
    scripts/satmae_temporal_prepare_csv.py rewrites image paths so they resolve
    under $SATMAE_TEMPORAL_WORKDIR/data. The upstream temporal dataset class
    then globs two companion frames for the same location. Eval uses the
    upstream RandomCrop(224) + Scale(224) path (not a center crop).
  image_size: 224x224
  frames: 3
  tta: false

output:
  metrics:
    format: JSON (metrics.json)
    fields:
      - n_images
      - top1_accuracy
      - top5_accuracy
      - runtime_seconds
      - gpu_name
      - peak_gpu_memory_gb
      - missing_keys
      - unexpected_keys
  confusion_matrix:
    format: CSV (confusion_matrix.csv), 62x62

environment:
  conda_env: $HOME/scratch/envs/satmae-temporal
  environment_file: scripts/satmae_temporal_environment.yml
  pip_requirements: scripts/satmae_temporal_requirements.txt
  pytorch: "1.12.1+cu113 from the PyTorch wheel index (not conda)"
  timm: "0.3.2, patched by scripts/satmae_temporal_patch_env.sh"
  upstream_code: https://github.com/sustainlab-group/SatMAE @ 0b210aceb37a14bbbd897110db5b104b3271d818
  workdir: $SATMAE_TEMPORAL_WORKDIR (default $HOME/scratch/satmae-temporal)

steps:
  - name: build_environment
    description: >
      Clone SatMAE at the pinned commit, create a conda prefix (python +
      rasterio only), then pip-install torch 1.12.1+cu113. Must run as a
      CPU batch job; login-node builds are killed by the 4 GB cap. Do not
      module-load anaconda3 if miniforge conda is already on PATH.
    script: scripts/satmae_temporal_build_env.sbatch
    partition: coc-cpu

  - name: patch_environment
    description: Rewrite timm 0.3.2 torch._six imports and SatMAE np.float dtypes.
    script: scripts/satmae_temporal_patch_env.sh

  - name: download_weights
    description: Download finetune_fmow_temporal.pth from Zenodo and write SHA-256.
    script: scripts/satmae_temporal_download_weights.sbatch
    partition: coc-cpu

  - name: download_data
    description: >
      Download val_62classes.csv from the SatMAE metadata Drive folder and the
      fMoW-RGB val prefix from public S3. Reconstruct *_rgb_crop_0.jpg AOI
      chips from each scene JSON. Train imagery is not downloaded.
    script: scripts/satmae_temporal_download_data.sbatch
    partition: coc-cpu

  - name: crop_aoi
    description: >
      Rebuild SatMAE *_rgb_crop_0.jpg chips from fMoW JSON bounding boxes.
      Needed when the S3 sync finished without crops (job 6192078: 53041
      missing). The crop sbatch also reruns prepare_csv.
    script: scripts/satmae_temporal_crop_fmow.sbatch
    partition: coc-cpu

  - name: prepare_csv
    description: >
      Rewrite image paths so they resolve under $SATMAE_TEMPORAL_WORKDIR/data
      and optionally write a class-stratified subset. The download and crop
      sbatches already run this; rerun it by hand if the CSV was copied in later.
    script: scripts/satmae_temporal_prepare_csv.py
    args:
      csv: $SATMAE_TEMPORAL_WORKDIR/data/val_62classes.csv
      data-root: $SATMAE_TEMPORAL_WORKDIR/data
      out: $SATMAE_TEMPORAL_WORKDIR/data/val_prepared.csv
      subset-out: $SATMAE_TEMPORAL_WORKDIR/data/val_subset500.csv
      subset-size: 500
      seed: 0

  - name: smoke_test
    description: First 100 rows only. Checks env, checkpoint keys, and data paths.
    script: scripts/satmae_temporal_smoke_test.sbatch

  - name: eval_subset
    description: Class-stratified 500-row subset. Informal cross-check / fallback.
    script: scripts/satmae_temporal_eval_subset.sbatch

  - name: eval_full
    description: Full prepared validation CSV. Primary comparison to 79.99% if data fits.
    script: scripts/satmae_temporal_eval_full.sbatch

  - name: eval_random
    description: Optional untrained-weights baseline on the subset (~1/62 chance).
    script: scripts/satmae_temporal_eval_random.sbatch

resource_requirements:
  satmae_temporal_vit_large_smoke:
    gpu_count: 1
    gpu_memory_gb: 12
    host_ram_gb: 32
    cpus: 4
    recommended_gpu: NVIDIA L40S
    estimated_runtime: 15-30 min for 100 sequences
  satmae_temporal_vit_large_full_val:
    gpu_count: 1
    gpu_memory_gb: 16
    host_ram_gb: 96
    cpus: 8
    recommended_gpu: NVIDIA L40S
    storage_gb: 30  # observed `du -sh` of $SATMAE_TEMPORAL_WORKDIR/data after crops
    notes: ICE user GPU-hour cap is 32 running GPU-hours.

compatible_resource_profiles:
  - resource-profiles/pace-ice/coc-gpu.yaml

compatible_optimization_profiles: []

slurm_example: |
  #!/bin/bash
  #SBATCH --job-name=satmae-temporal-full
  #SBATCH -A coc
  #SBATCH -p coc-gpu
  #SBATCH --qos=coc-ice
  #SBATCH --gres=gpu:l40s:1
  #SBATCH --cpus-per-task=8
  #SBATCH --mem=96G
  #SBATCH --time=04:00:00
  #SBATCH --output=logs/satmae_temporal_full_%j.out

  export SATMAE_TEMPORAL_WORKDIR="${SATMAE_TEMPORAL_WORKDIR:-$HOME/scratch/satmae-temporal}"
  source "$(conda info --base)/etc/profile.d/conda.sh"
  set +u; conda activate "$HOME/scratch/envs/satmae-temporal"; set -u

  python scripts/satmae_temporal_evaluate.py \
    --csv "${SATMAE_TEMPORAL_WORKDIR}/data/val_prepared.csv" \
    --checkpoint "${SATMAE_TEMPORAL_WORKDIR}/weights/finetune_fmow_temporal.pth" \
    --code-dir "${SATMAE_TEMPORAL_WORKDIR}/SatMAE" \
    --out-dir "${SATMAE_TEMPORAL_WORKDIR}/results/full" \
    --batch-size 8 --num-workers 8 --seed 0

  # Full version (nvidia-smi, versions, wall time, sacct) is
  # scripts/satmae_temporal_eval_full.sbatch. Submit from the repo root:
  # mkdir -p logs && sbatch scripts/satmae_temporal_eval_full.sbatch

verification:
  expected_top1: 79.99
  paper_no_tta_top1: 79.69
  tolerance_pct_points: 1.0
  chance_top1: 1.61  # 1/62
  observed:
    status: completed-with-documented-gap
    date: "2026-10-11"
    gpu: NVIDIA L40S
    smoke:
      job_id: "6196203"
      n_images: 100
      missing_keys: 0
      unexpected_keys: 0
      top1: 58.00
      result: pass-pipeline
    subset500:
      job_id: "6197584"
      n_images: 500
      top1: 61.00
      top5: 77.80
      result: pass-above-chance
    full:
      job_id: "6197773"
      n_images: 53041
      top1: 62.60
      top5: 79.77
      runtime_seconds: 935.8
      peak_gpu_memory_gb: 2.05
      result: miss-vs-79.99-documented-crop-gap

notes: >
  Reproducibility issues known before the first ICE run, each handled in scripts:

  1. Official eval launches 8 processes via torch.distributed.launch. The
     assignment evaluator is single-GPU and imports only the temporal model
     and dataset class.
  2. The released checkpoint must be loaded with --nb-classes 1000.
  3. timm 0.3.2 imports torch._six.container_abcs. patch_env.sh rewrites
     site-packages files without importing timm (job 6190908 failed when
     the patch script imported timm first).
  4. CustomDatasetFromImagesTemporal uses RandomCrop even at eval time, so
     a seeded run is required for comparability. Companion-frame glob is
     sorted; DataLoader workers are seeded. A peer still saw 61.63% vs
     62.60% on a fresh clone before those changes.
  5. fMoW-RGB is ~200 GB train+val. This recipe downloads val only.
  6. Home on ICE is 30 GB (this user was at 96.9%). All artifacts go to scratch.
  7. Do not module-load anaconda3 over miniforge. PyTorch is pip cu113,
     not conda pytorch=1.12.1 (MKL iJIT_NotifyEvent on a peer account).
